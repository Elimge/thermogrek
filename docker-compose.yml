services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: thermogrek-mqtt
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_HOST_EXTERNAL_PORT:-18883}:1883"
    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - thermogrek-net

  database:
    image: postgres:16-alpine
    container_name: thermogrek-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thermogrek_db}
      POSTGRES_USER: ${POSTGRES_USER:-thermogrek_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thermogrek_dev_pass_secure_2026}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - thermogrek-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thermogrek_user} -d ${POSTGRES_DB:-thermogrek_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: thermogrek-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      PUBLISH_INTERVAL_SEC: 1.0
      DEGRADATION_RATE: 0.1
    depends_on:
      - mqtt-broker
    networks:
      - thermogrek-net

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: thermogrek-ingestion
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-thermogrek_db}
      POSTGRES_USER: ${POSTGRES_USER:-thermogrek_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thermogrek_dev_pass_secure_2026}
    depends_on:
      database:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    networks:
      - thermogrek-net

networks:
  thermogrek-net:
    driver: bridge

volumes:
  postgres-data:
